spring.application.name=blog-platform
spring.main.banner-mode=off
jwt.secret=your-256-bit-secret-key-here-make-it-at-least-32-bytes-long
#
# Datasource, PostgreSQL
#
spring.datasource.url=jdbc:postgresql://localhost:5432/blog-platform
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=springbootstudent

#
# JPA
#
spring.jpa.hibernate.ddl-auto=update

# PostgreSQLDialect does not need to be specified explicitly using 'hibernate.dialect'
# (remove the property setting, and it will be selected by default)
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# used for logging: Hibernate: select u1_0.id,u1_0.created_date,u1_0.email,u1_0.name,u1_0.password from users u1_0 where u1_0.email=?
#spring.jpa.show-sql=true

# format the sql
#spring.jpa.properties.hibernate.format_sql=true

# 2025-03-01T17:09:23.903+02:00 DEBUG 918 --- [blog-platform] [nio-8080-exec-2] org.hibernate.SQL                        : select u1_0.id,u1_0.created_date,u1_0.email,u1_0.name,u1_0.password from users u1_0 where u1_0.email=?
logging.level.org.hibernate.SQL=TRACE

# 2025-03-01T17:09:59.407+02:00 DEBUG 949 --- [blog-platform] [nio-8080-exec-2] tor$SharedEntityManagerInvocationHandler : Creating new EntityManager for shared EntityManager invocation
# 2025-03-01T17:09:59.466+02:00 DEBUG 949 --- [blog-platform] [nio-8080-exec-2] o.j.s.OpenEntityManagerInViewInterceptor : Opening JPA EntityManager in OpenEntityManagerInViewInterceptor
# 2025-03-01T17:09:59.518+02:00 DEBUG 949 --- [blog-platform] [nio-8080-exec-2] o.j.s.OpenEntityManagerInViewInterceptor : Closing JPA EntityManager in OpenEntityManagerInViewInterceptor
#logging.level.org.springframework.orm.jpa=TRACE

#
# Logging
#
logging.level.root=WARN
logging.level.com.dev.blog_platform=DEBUG
logging.file.name=logs/application.log



