#
# APP settings
#
spring.application.name=ecom-platform-2
spring.main.banner-mode=off
frontend.url=http://localhost:5173/
#
# Datasource, PostgreSQL
#
spring.datasource.url=jdbc:postgresql://localhost:5432/econ-platform-2
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=dev
spring.datasource.password=test1234
#
# JPA
#
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
#
# Image upload settings
project.settings.image.path=images/
project.settings.image.max-size=5MB
project.settings.image.allowed-types=jpg,jpeg,png,webp
#
# Logs
#
# print the endpoint when receives a request
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
# print the headers for request and response
spring.mvc.log-request-details=true
#
# Logs
# show JPA/Hibernate logging messages
#
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#
# Logging
#
logging.level.root=WARN
logging.level.com.dev.blog_platform=DEBUG
logging.file.name=logs/application.log

